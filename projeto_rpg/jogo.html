<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div>
        <div class="container">
            <div class="card text-center">
                <div class="card-header">RPG: Criado por Vitória</div>
                <div class="card-body" id="tela"
                    style="background-image: url('assets/y9fipepwhnid1.gif');background-repeat: no-repeat ;background-size: cover; background-position: 25%;">

                    <p class="card-text">turno 1👾</p>
                    <div class="row">
                        <div class="col text-end" id="col-heroi">
                            <ul class="list-group float-end" style="width: 225px;">
                                <li id="nome-heroi" class="list-group-item">David</li>
                                <li id="titulo-heroi" class="list-group-item">🗡️</li>
                                <li id="hp-heroi" class="list-group-item">🫀<progress id="hp-hero" value="100" max="100"
                                        style="accent-color: red;"></progress></li>
                                <li id="mp-heroi" class="list-group-item">🪫<progress id="mp-hero" value="100" max="100"
                                        style="accent-color: red;"></progress></li>
                                <li id="en-heroi" class="list-group-item">💣️ <progress id="en-hero" value="0" max="100"
                                        style="accent-color: orange;"></progress></li>
                            </ul>






                        </div>
                        <div class="col" id="col-boss">
                            <ul class=" list-group  text-center" style="width: 225px;">
                                <li id="nome-boss" class="list-group-item">🔥Smaug</li>
                                <li id="titulo-boss" class="list-group-item">🔥</li>
                                <li class="list-group-item">🫀<progress id="hp-boss" value="100" max="100"
                                        style="accent-color: red;"></progress></li>
                                <li class="list-group-item">🪫<progress id="en-boss" value="100" max="100"
                                        style="accent-color: red;"></progress></li>

                            </ul>

                        </div>
                    </div>
                    <div class="row">
                        <div class="col text-end" id="col-botoes">



                            <div>
                                <img src="assets/heroi5.gif" width="200px" height="200px">
                            </div>

                            <div class="btn-group" id="controles">



                            </div>





                        </div>
                        <div class="col text-start" id="col-msg">
                            <img src="assets/boss7.gif" width="200px" height="200px">

                        </div>

                    </div>

                </div>
                <div class="card-footer"></div>
                <small class="text-muted" id="log-hero"></small>
                <p></p>
                <small class="text-muted" id="log-boss"></small>

            </div>
        </div>
</body>
<script src="jogo.js">

</script>

</html>
